name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number. 3 digits for a release (e.g. 1.2.0), 4 digits for a canary (e.g. 1.2.0.1-canary)."
        required: true
      is_canary:
        description: "Canary (pre-release) build?"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version format
        run: |
          IS_CANARY='${{ github.event.inputs.is_canary }}'
          VERSION='${{ github.event.inputs.version }}'

          if [[ "$IS_CANARY" == "true" ]]; then
            if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Canary releases must use a 4-digit version (e.g. 1.2.0.1 or 1.2.0.1-canary)."
              exit 1
            fi
          else
            if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Full releases must use a 3-digit version (e.g. 1.2.0)."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The .wasm binaries are gitignored, so a clean checkout has the loaders
      # without the runtime they load. Building without this ships an extension
      # that fails only once a track is separated.
      - name: Restore ORT binaries
        run: npm run sync:ort

      - name: Update version
        run: node tooling/update-version.mjs ${{ github.event.inputs.version }}

      - name: Build
        run: npm run build

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --staged --quiet; then
            git commit -m "Release version ${{ github.event.inputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
          git tag -a "v${{ github.event.inputs.version }}" -m "Version ${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Zip the unpacked extension
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../tacet-v${{ github.event.inputs.version }}-chrome.zip .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "tacet-v${{ github.event.inputs.version }}-chrome.zip"
          tag: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ github.event.inputs.is_canary == 'true' }}
          generateReleaseNotes: true
          draft: true
